name: Copilot Setup Steps

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24.21.0"
      - name: Install RepoPilot
        run: npm install -g repopilot@0.25.0
      - name: Verify the installed CLI
        run: repopilot --version
      - name: Mark the starting state
        run: repopilot snapshot
