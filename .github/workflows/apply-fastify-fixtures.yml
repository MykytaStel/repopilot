name: Apply Fastify changelog

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fastify-request-taint
          fetch-depth: 0

      - name: Update changelog and remove helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "### Added\n\n"
          entry = '''- **Fastify request taint analysis.** The JavaScript/TypeScript frontend now
  recognizes Fastify URL and proxy-derived request metadata, including
  `request.raw.url`, `request.url`, `request.ip`, `request.ips`,
  `request.hostname`, and `request.protocol`, as HTTP request sources.
  Parameterized SQL remains quiet, `reply.send()` is excluded from source
  classification, and differential safe/unsafe review-zoo fixtures pin the
  request-to-raw-SQL boundary.
'''
          if entry not in text:
              if marker not in text:
                  raise SystemExit("CHANGELOG Added marker not found")
              changelog.write_text(text.replace(marker, marker + entry, 1), encoding="utf-8")

          Path(".github/workflows/apply-fastify-fixtures.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: document Fastify request taint analysis"
          git push origin HEAD:feat/fastify-request-taint
