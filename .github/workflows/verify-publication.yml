name: Verify publication

# Re-run the public-channel verification for a release tag, e.g. after a
# manual `Publish crates.io` or `Publish npm` recovery. Read-only.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify, e.g. v0.23.0"
        required: true
        type: string

permissions:
  contents: read

env:
  RUST_STABLE: "1.95.0"

jobs:
  verify-publication:
    name: Verify public release channels
    runs-on: ubuntu-latest
    steps:
      # Verification tooling comes from the default branch; expected digests
      # are rebuilt from the tagged sources.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          path: release-source

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Verify GitHub, crates.io, npm, and Homebrew
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.tag }}
          SOURCE_DIR: release-source
        run: scripts/verify-publication.sh
