name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # crates.io rejects API requests without a descriptive User-Agent (HTTP 403).
  CRATES_USER_AGENT: repopilot-release (https://github.com/MykytaStel/repopilot)
  RUST_STABLE: "1.95.0"

jobs:
  verify-contract:
    name: Verify release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: Verify tag, versions, docs, and package contents
        run: python3 scripts/release-contract.py check --tag "${GITHUB_REF_NAME}"

      - name: Verify publishing credentials
        # crates.io publishes through Trusted Publishing (OIDC); no API token.
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          test -n "$HOMEBREW_TAP_TOKEN" || {
            echo "::error::HOMEBREW_TAP_TOKEN is required for an official release"
            exit 1
          }

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: verify-contract
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE }}
          targets: ${{ matrix.target }}

      - name: Add Rust target for native build
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        # rust-toolchain.toml pins `channel = "stable"`, which cargo resolves to
        # a different toolchain instance than the pinned RUST_STABLE that the
        # toolchain action added the target to. Add the target to the toolchain
        # cargo actually uses (resolved here in the repo dir) so non-host targets
        # — e.g. x86_64-apple-darwin on the now-arm64 macos-latest runner — have
        # std available.
        run: rustup target add ${{ matrix.target }}

      - name: Install cross (Linux aarch64 only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross --rev f8151ae777290430cf2108efacf3976d9528500b --locked

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          BINARY_NAME=repopilot
          ASSET_NAME="${BINARY_NAME}-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" dist/
          cd dist
          tar -czf "${ASSET_NAME}.tar.gz" "${BINARY_NAME}"
          shasum -a 256 "${ASSET_NAME}.tar.gz" > "${ASSET_NAME}.tar.gz.sha256"
          echo "ASSET=dist/${ASSET_NAME}.tar.gz" >> "$GITHUB_ENV"
          echo "CHECKSUM=dist/${ASSET_NAME}.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $BinaryName = "repopilot"
          $AssetName = "${BinaryName}-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/${BinaryName}.exe" dist/
          Compress-Archive -Path "dist/${BinaryName}.exe" -DestinationPath "dist/${AssetName}.zip"
          Get-FileHash "dist/${AssetName}.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  ${AssetName}.zip" } | Out-File -Encoding ascii "dist/${AssetName}.zip.sha256"
          echo "ASSET=dist/${AssetName}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CHECKSUM=dist/${AssetName}.zip.sha256" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Smoke packaged archive (Unix)
        if: matrix.archive == 'tar.gz' && matrix.target != 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p packaged-smoke
          tar -xzf "$ASSET" -C packaged-smoke
          ./packaged-smoke/repopilot --version

      - name: Smoke packaged archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $SmokeDir = "packaged-smoke"
          Expand-Archive -Path $env:ASSET -DestinationPath $SmokeDir
          & ".\$SmokeDir\repopilot.exe" --version

      - name: Record cross-compiled smoke boundary
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: echo "::notice::packaged archive smoke is unavailable for the cross-compiled Linux ARM target on this runner"

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}

      - name: Upload packaged artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}
          if-no-files-found: error

  verify-crates-package:
    name: Verify crates.io package
    runs-on: ubuntu-latest
    needs: verify-contract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: Publish dry run
        run: cargo publish --dry-run

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build
      - verify-crates-package
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate release notes from curated docs
        id: release-notes
        run: |
          python3 scripts/release-contract.py notes \
            --tag "${GITHUB_REF_NAME}" \
            --output dist/release-notes.md
          {
            echo "title<<EOF"
            python3 scripts/release-contract.py title --tag "${GITHUB_REF_NAME}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ steps.release-notes.outputs.title }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          body_path: dist/release-notes.md
          generate_release_notes: false
          # Release candidates (vX.Y.Z-rc.N) are prereleases and never "latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs:
      - release
    # Must match the crates.io Trusted Publisher: release.yml + environment "release".
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: Authenticate with crates.io (Trusted Publishing)
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish or verify crates.io package
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          set -euo pipefail
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          CRATE_PATH="target/package/repopilot-${VERSION}.crate"
          cargo package --allow-dirty --no-verify
          LOCAL_CHECKSUM="$(sha256sum "$CRATE_PATH" | awk '{print $1}')"
          metadata_file="$(mktemp)"
          if ! status="$(curl -sS -A "$CRATES_USER_AGENT" -o "$metadata_file" -w '%{http_code}' "https://crates.io/api/v1/crates/repopilot/${VERSION}")"; then
            echo "::error::network-failure while checking crates.io repopilot@${VERSION}"
            exit 1
          fi
          case "$status" in
            200)
              REMOTE_CHECKSUM="$(jq -r '.version.checksum // empty' "$metadata_file")"
              if [[ -z "$REMOTE_CHECKSUM" || "$REMOTE_CHECKSUM" != "$LOCAL_CHECKSUM" ]]; then
                echo "::error::published-mismatch for crates.io repopilot@${VERSION}; refusing to overwrite an immutable package"
                exit 1
              fi
              echo "Skipping crates.io repopilot@${VERSION}: version.checksum matches."
              ;;
            404)
              echo "Publishing crates.io repopilot@${VERSION}: package is absent."
              cargo publish
              ;;
            401|403)
              echo "::error::auth-failure while checking crates.io repopilot@${VERSION}"
              exit 1
              ;;
            429)
              echo "::error::rate-limit-failure while checking crates.io repopilot@${VERSION}"
              exit 1
              ;;
            *)
              echo "::error::service-failure while checking crates.io repopilot@${VERSION} (HTTP ${status})"
              exit 1
              ;;
          esac
          rm -f "$metadata_file"

  publish-npm:
    name: Publish npm packages
    needs:
      - release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  update-homebrew-tap:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs:
      - release
    # The tap serves stable releases only; release candidates skip it.
    if: ${{ !contains(github.ref_name, '-') }}
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Extract checksums
        run: |
          V="${{ github.ref_name }}"
          MACOS_ARM="$(awk '{print $1}' "dist/repopilot-${V}-aarch64-apple-darwin.tar.gz.sha256")"
          MACOS_X86="$(awk '{print $1}' "dist/repopilot-${V}-x86_64-apple-darwin.tar.gz.sha256")"
          LINUX_ARM="$(awk '{print $1}' "dist/repopilot-${V}-aarch64-unknown-linux-gnu.tar.gz.sha256")"
          LINUX_X86="$(awk '{print $1}' "dist/repopilot-${V}-x86_64-unknown-linux-gnu.tar.gz.sha256")"
          {
            echo "MACOS_ARM=${MACOS_ARM}"
            echo "MACOS_X86=${MACOS_X86}"
            echo "LINUX_ARM=${LINUX_ARM}"
            echo "LINUX_X86=${LINUX_X86}"
            echo "VER=${V#v}"
          } >> "$GITHUB_ENV"

      - name: Checkout homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MykytaStel/homebrew-repopilot
          path: tap
          token: ${{ env.HOMEBREW_TAP_TOKEN }}

      - name: Write formula
        run: |
          sed -e "s/{{VERSION}}/${{ env.VER }}/g" \
              -e "s/{{MACOS_ARM_SHA}}/${{ env.MACOS_ARM }}/g" \
              -e "s/{{MACOS_X86_SHA}}/${{ env.MACOS_X86 }}/g" \
              -e "s/{{LINUX_ARM_SHA}}/${{ env.LINUX_ARM }}/g" \
              -e "s/{{LINUX_X86_SHA}}/${{ env.LINUX_X86 }}/g" \
              Formula/repopilot.rb > tap/Formula/repopilot.rb

      - name: Push formula update
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/repopilot.rb
          git diff --cached --quiet || git commit -m "repopilot ${{ env.VER }}"
          git push

  verify-publication:
    name: Verify public release channels
    runs-on: ubuntu-latest
    needs:
      - publish-crates
      - publish-npm
      - update-homebrew-tap
    if: ${{ always() }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Verify GitHub, crates.io, npm, and Homebrew
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          echo "Upstream results: crates=${{ needs.publish-crates.result }}, npm=${{ needs.publish-npm.result }}, homebrew=${{ needs.update-homebrew-tap.result }}"
          scripts/verify-publication.sh
