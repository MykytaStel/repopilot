# Copy to .github/workflows/copilot-setup-steps.yml. GitHub Copilot coding agent
# runs this job before it starts work, so RepoPilot is installed and the
# repository state is marked for `repopilot review --since-snapshot`.
name: Copilot Setup Steps

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
      - name: Install RepoPilot
        run: npm install -g repopilot
      - name: Mark the starting state
        run: repopilot snapshot
